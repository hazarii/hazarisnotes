<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hazarisNotes</title>
  <!-- Tailwind CSS CDN for instant clean styling -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">

  <div class="max-w-3xl mx-auto space-y-8">
    
    <!-- Header -->
    <header class="text-center">
      <h1 class="text-4xl font-extrabold tracking-tight text-indigo-400">⚡ Hazari's Notes</h1>
      <p class="text-slate-400 mt-1">Lightweight, real-time notes powered by Firebase</p>
      <div class="mt-4 flex justify-center items-center gap-3">
        <button id="sign-in-button" type="button" class="bg-indigo-600 hover:bg-indigo-500 font-semibold px-4 py-2 rounded-lg transition-colors shadow-md">
          Sign in with Google
        </button>
        <span id="user-label" class="hidden text-sm text-slate-400"></span>
        <button id="sign-out-button" type="button" class="hidden text-sm text-indigo-400 hover:text-indigo-300">Sign out</button>
      </div>
    </header>

    <!-- Create Note Form -->
    <form id="note-form" class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl space-y-4">
      <div>
        <input 
          type="text" 
          id="title" 
          placeholder="Note title..." 
          required 
          class="w-full bg-slate-900 text-slate-100 placeholder-slate-500 rounded-lg p-3 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>
      <div>
        <textarea 
          id="content" 
          placeholder="Write your note here..." 
          rows="3" 
          required 
          class="w-full bg-slate-900 text-slate-100 placeholder-slate-500 rounded-lg p-3 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        ></textarea>
      </div>
      <button 
        type="submit" 
        class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-3 rounded-lg transition-all shadow-md active:scale-[0.99]"
      >
        Add Note
      </button>
      <a
        href="notes.html"
        class="block text-center text-sm text-indigo-400 hover:text-indigo-300 transition-colors"
      >
        View all notes
      </a>
      <p id="error-message" class="hidden text-sm text-rose-400"></p>
    </form>

    <!-- Notes List Grid -->
    <div id="notes-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Dynamic notes will be inserted here -->
    </div>

  </div>

  <!-- Firebase SDK (Modular v10+) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      deleteDoc, 
      doc, 
      query, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    // 1. Replace with your actual Firebase project configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCBPbwkE7YkvvgvkMYWjjnUhZnJRnUSgg0",
      authDomain: "hazarisnotes.firebaseapp.com",
      projectId: "hazarisnotes",
      storageBucket: "hazarisnotes.firebasestorage.app",
      messagingSenderId: "422718641305",
      appId: "1:422718641305:web:029b85370493baafe8d408",
      measurementId: "G-GBRHXX2C2D"
    };

    // 2. Initialize Firebase & Firestore
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const notesCollection = collection(db, "notes");

    // DOM Elements
    const noteForm = document.getElementById("note-form");
    const titleInput = document.getElementById("title");
    const contentInput = document.getElementById("content");
    const notesContainer = document.getElementById("notes-container");
    const errorMessage = document.getElementById("error-message");
    const signInButton = document.getElementById("sign-in-button");
    const signOutButton = document.getElementById("sign-out-button");
    const userLabel = document.getElementById("user-label");
    const submitButton = noteForm.querySelector("button[type=submit]");
    const googleProvider = new GoogleAuthProvider();
    let currentUser;
    let notesStarted = false;
    let formListenerStarted = false;
    let unsubscribeNotes;

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.remove("hidden");
    }

    signInButton.addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (err) {
        console.error("Error signing in with Google: ", err);
        showError(`Could not sign in with Google: ${err.code === "auth/unauthorized-domain" ? "Open this site through http://localhost:8000 or add your deployed domain in Firebase Authorized domains." : err.message}`);
      }
    });

    signOutButton.addEventListener("click", () => signOut(auth));

    function startNotes(user) {
      if (notesStarted) return;
      notesStarted = true;
      currentUser = user;
      signInButton.classList.add("hidden");
      signOutButton.classList.remove("hidden");
      userLabel.textContent = user.displayName || user.email || "Signed in";
      userLabel.classList.remove("hidden");
      submitButton.disabled = false;

    // 3. Create Note
    if (!formListenerStarted) {
      formListenerStarted = true;
      noteForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = titleInput.value.trim();
      const content = contentInput.value.trim();

      if (!title || !content) return;
      if (!currentUser) {
        showError("You must be signed in before adding notes.");
        return;
      }

      try {
        errorMessage.classList.add("hidden");
        await addDoc(notesCollection, {
          title: title,
          content: content,
          ownerId: currentUser.uid,
          ownerName: currentUser.displayName || currentUser.email || "Unknown author",
          createdAt: serverTimestamp()
        });
        
        // Clear inputs
        titleInput.value = "";
        contentInput.value = "";
      } catch (err) {
        console.error("Error adding note: ", err);
        showError(`Could not add note: ${err.code === "permission-denied" ? "Firestore permissions do not allow writes." : err.message}`);
      }
      });
    }

    // 4. Real-time Listener (Read Notes)
      const q = query(notesCollection);

      unsubscribeNotes = onSnapshot(q, (snapshot) => {
      notesContainer.innerHTML = ""; // Clear existing notes render

      if (snapshot.empty) {
        notesContainer.innerHTML = `
          <div class="col-span-full text-center text-slate-500 py-8">
            No notes yet. Add your first note above!
          </div>
        `;
        return;
      }

      const noteSnapshots = snapshot.docs.sort((first, second) => {
        const firstTime = first.data().createdAt?.toMillis() || 0;
        const secondTime = second.data().createdAt?.toMillis() || 0;
        return secondTime - firstTime;
      });

      noteSnapshots.forEach((docSnapshot) => {
        const data = docSnapshot.data();
        const id = docSnapshot.id;

        const noteCard = document.createElement("div");
        noteCard.className = "bg-slate-800 p-5 rounded-xl border border-slate-700 flex flex-col justify-between space-y-4 shadow-lg";
        noteCard.innerHTML = `
          <div>
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1 mb-2">
              <p class="text-xs text-indigo-300">${escapeHTML(formatTimestamp(data.createdAt))} | ${escapeHTML(data.ownerName || data.ownerEmail || "Unknown author")}</p>
            </div>
            <h3 class="text-xl font-bold text-slate-100">${escapeHTML(data.title)}</h3>
            <p class="text-slate-300 mt-2 whitespace-pre-wrap leading-relaxed text-sm">${escapeHTML(data.content)}</p>
          </div>
          ${data.ownerId === currentUser.uid ? `
            <div class="flex justify-end pt-2 border-t border-slate-700/50">
              <a
                href="edit.html?id=${encodeURIComponent(id)}"
                class="mr-2 text-xs font-medium text-indigo-400 hover:text-indigo-300 transition-colors bg-indigo-950/40 hover:bg-indigo-900/40 px-3 py-1.5 rounded-md border border-indigo-800/40"
              >
                Edit
              </a>
              <button 
                data-id="${id}" 
                class="delete-btn text-xs font-medium text-rose-400 hover:text-rose-300 transition-colors bg-rose-950/40 hover:bg-rose-900/40 px-3 py-1.5 rounded-md border border-rose-800/40"
              >
                Delete
              </button>
            </div>
          ` : ""}
        `;

        notesContainer.appendChild(noteCard);
      });

      // Attach delete handlers
      document.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", async (e) => {
          const noteId = e.target.getAttribute("data-id");
          await deleteDoc(doc(db, "notes", noteId));
        });
      });
      }, (err) => {
        console.error("Error loading notes: ", err);
        showError(`Could not load notes: ${err.code === "permission-denied" ? "Firestore permissions do not allow reads." : err.message}`);
      });
    }

    submitButton.disabled = true;
    onAuthStateChanged(auth, (user) => {
      if (user && !user.isAnonymous) {
        startNotes(user);
        return;
      }

      if (unsubscribeNotes) {
        unsubscribeNotes();
        unsubscribeNotes = null;
      }
      notesStarted = false;
      currentUser = null;
      submitButton.disabled = true;
      signInButton.classList.remove("hidden");
      signOutButton.classList.add("hidden");
      userLabel.classList.add("hidden");
      notesContainer.innerHTML = "";
      errorMessage.classList.add("hidden");
    });

    // Helper function to prevent XSS attacks
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    function formatTimestamp(timestamp) {
      if (!timestamp) return "Pending timestamp";
      return timestamp.toDate().toLocaleString();
    }
  </script>
</body>
</html>
